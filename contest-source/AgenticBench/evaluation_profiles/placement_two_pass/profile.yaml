schema_version: 1
id: placement_two_pass_sta
title: Fixed-partition placement promotion to two-pass timing optimization
description: Replay a selected concurrent two-die placement candidate under its frozen partition, then run HBT construction and exactly two coordinated timing-optimization passes before continuous passive-HBT STA.
kind: placement_two_pass_sta
base_config: ../../local_bench/benchmark_inputs/bp_lol_ng45_tp_gnn_placement/config.yaml
benchmark_input: bp_lol_ng45_tp_gnn_placement
initial_candidate: initial_candidate
prompt: prompt.md
program:
  mode: candidate_literal
prompt_context:
  priority_parameters:
    - final_global_wns_setup_ns
    - final_global_tns_setup_ns
    - initial_global_wns_setup_ns
    - initial_global_tns_setup_ns
    - pass1_global_wns_setup_ns
    - pass1_global_tns_setup_ns
    - placement_total_hpwl_um
    - placement_overflow_bottom
    - placement_overflow_top
    - hbt_count
  feedback_recent: 0
  feedback_top: 0
  max_feedback_chars: 0
  max_source_chars: 0
execution:
  from: placement
  to: opt
  upstream_stages: [input, floorplan, partition]
candidate_policy:
  allowed_config_paths:
    - placement.target_density
  allowed_source_paths:
    - Place-3D/src/placement/concurrent_dreamplace.py
    - Place-3D/thirdparty/DREAMPlace/dreamplace/BasicPlace.py
    - Place-3D/thirdparty/DREAMPlace/dreamplace/PlaceObj.py
    - Place-3D/thirdparty/DREAMPlace/dreamplace/NonLinearPlace.py
  max_changed_files: 4
  max_added_lines: 800
  max_deleted_lines: 400
  files:
    - path: placement.json
      inject_as: placement.config
      allowed_paths:
        - concurrent_dreamplace.cross_die_net_weight
        - concurrent_dreamplace.iterations
        - concurrent_dreamplace.num_bins
        - concurrent_dreamplace.target_density
        - concurrent_dreamplace.stop_overflow
        - concurrent_dreamplace.density_weight
        - concurrent_dreamplace.macro_place_flag
        - concurrent_dreamplace.macro_halo_x
        - concurrent_dreamplace.macro_halo_y
        - concurrent_dreamplace.learning_rate
        - concurrent_dreamplace.die_params.bottom.target_density
        - concurrent_dreamplace.die_params.bottom.filler_area_scale
        - concurrent_dreamplace.die_params.bottom.stop_overflow
        - concurrent_dreamplace.die_params.top.target_density
        - concurrent_dreamplace.die_params.top.filler_area_scale
        - concurrent_dreamplace.die_params.top.stop_overflow
        - concurrent_dreamplace.hide_fillers_in_plot
  value_constraints:
    - {path: /config_overrides/placement/target_density, type: number, enum: [0.6]}
    - {path: /candidate_files/placement.json/concurrent_dreamplace/cross_die_net_weight, type: number, enum: [1.0]}
    - {path: /candidate_files/placement.json/concurrent_dreamplace/iterations, type: integer, enum: [2000]}
    - {path: /candidate_files/placement.json/concurrent_dreamplace/num_bins, type: integer, enum: [512]}
    - {path: /candidate_files/placement.json/concurrent_dreamplace/target_density, type: number, enum: [0.6]}
    - {path: /candidate_files/placement.json/concurrent_dreamplace/stop_overflow, type: number, enum: [0.01]}
    - {path: /candidate_files/placement.json/concurrent_dreamplace/density_weight, type: number, enum: [0.00003]}
    - {path: /candidate_files/placement.json/concurrent_dreamplace/macro_place_flag, type: boolean, enum: [false]}
    - {path: /candidate_files/placement.json/concurrent_dreamplace/macro_halo_x, type: number, enum: [10.0]}
    - {path: /candidate_files/placement.json/concurrent_dreamplace/macro_halo_y, type: number, enum: [10.0]}
    - {path: /candidate_files/placement.json/concurrent_dreamplace/learning_rate, type: number, enum: [0.01]}
    - {path: /candidate_files/placement.json/concurrent_dreamplace/die_params, type: object}
    - {path: /candidate_files/placement.json/concurrent_dreamplace/die_params/bottom/target_density, type: number, minimum: 0.35, maximum: 1.0, required: false}
    - {path: /candidate_files/placement.json/concurrent_dreamplace/die_params/bottom/filler_area_scale, type: number, minimum: 0.0, maximum: 2.0, required: false}
    - {path: /candidate_files/placement.json/concurrent_dreamplace/die_params/bottom/stop_overflow, type: number, minimum: 0.001, maximum: 0.20, required: false}
    - {path: /candidate_files/placement.json/concurrent_dreamplace/die_params/top/target_density, type: number, minimum: 0.35, maximum: 1.0, required: false}
    - {path: /candidate_files/placement.json/concurrent_dreamplace/die_params/top/filler_area_scale, type: number, minimum: 0.0, maximum: 2.0, required: false}
    - {path: /candidate_files/placement.json/concurrent_dreamplace/die_params/top/stop_overflow, type: number, minimum: 0.001, maximum: 0.20, required: false}
    - {path: /candidate_files/placement.json/concurrent_dreamplace/hide_fillers_in_plot, type: boolean}
