schema_version: 1
id: tp_gnn_sta_inner
title: TP-GNN partition proxy for hierarchical STA optimization
description: Evaluate one already proposed TP-GNN correction with a fast partition-only first-improvement proxy before optional two-pass STA promotion.
kind: tp_gnn_learning_objective
base_config: ../../local_bench/benchmark_inputs/bp_multi_lol_ng45_tp_gnn_sta/config.yaml
benchmark_input: bp_multi_lol_ng45_tp_gnn_sta
initial_candidate: initial_candidate
prompt: prompt.md
program:
  mode: candidate_literal
prompt_context:
  priority_parameters:
    - timing_weighted_cut
    - timing_weighted_cut_ratio
    - cut_net_count
    - area_balance_error
    - tp_gnn_final_loss
    - tp_gnn_embedding_total_variance
  feedback_recent: 3
  feedback_top: 3
  max_feedback_chars: 24000
  max_source_chars: 100000
  source_ranges:
    - {path: Place-3D/src/partition/lol/methods/tp_gnn.py, start_line: 35, end_line: 94}
    - {path: Place-3D/src/partition/lol/methods/tp_gnn.py, start_line: 576, end_line: 706}
    - {path: Place-3D/src/partition/lol/methods/tp_gnn.py, start_line: 875, end_line: 1200}
    - {path: Place-3D/src/partition/lol/methods/tp_gnn.py, start_line: 1201, end_line: 1515}
execution:
  from: partition
  to: partition
  upstream_stages: [input, floorplan]
  frozen_inputs:
    - name: tp_gnn_timing
      source: baseline_run
      path: 20_partition/timing_input
      inject_as: partition.timing_input
      required_files:
        - timing_features.csv
        - timing_net_weights.csv
        - timing_manifest.json
        - openroad_full_partition_last.connections.tsv
      json_checks:
        - path: timing_manifest.json
          equals:
            timing_status: full_coverage_partition_last
            timing_weight_mode: paper_delay_slack_hyperedge_v1
candidate_policy:
  allowed_config_paths:
    - partition.algorithm
  allowed_source_paths:
    - Place-3D/src/partition/lol/methods/tp_gnn.py
  max_changed_files: 1
  max_added_lines: 1000
  max_deleted_lines: 500
  files: []
  value_constraints:
    - {path: /config_overrides/partition/algorithm, type: string, enum: [tp-gnn]}
