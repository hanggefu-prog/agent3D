schema_version: 1
id: lol_full_flow_ppa
title: LoL full-flow PPA optimization
instruction: instruction.md

source:
  repository: Open3DBench-V2.0
  revision: HEAD

workspace:
  container_path: /workspace
  runs_path: /runs
  scratch_path: /scratch
  protected_paths:
    - AgenticBench
    - tests
    - open3dbench/cli.py
    - open3dbench/benchmarks.py
    - open3dbench/config.py
    - open3dbench/pdks.py
    - open3dbench/runner.py
    - open3dbench/stage_manifest.py
    - open3dbench/placement_metrics.py
    - open3dbench/backend/contracts.py
    - open3dbench/backend/sta_completeness.py
    - open3dbench/backend/post_placement_sta.py
    - open3dbench/backend/post_route.py
    - open3dbench/backend/passive_reconstruction.py
    - open3dbench/backend/thermal.py
    - Place-3D/src/validation.py
    - Place-3D/src/evaluation
    - OpenROAD-3D/flow/scripts/final_report.tcl
    - OpenROAD-3D/flow/scripts/report_metrics.tcl
    - OpenROAD-3D/flow/platforms
    - docker

environment:
  image: open3dbench:release
  image_digest: null
  cpu: 32
  memory_gb: 128
  storage_gb: 256
  gpus: 1
  walltime_seconds: 86400
  network: restricted
  pids_limit: 4096

inputs:
  - name: benchmark_input
    source: ${OPENAGENTIC3D_GLOBAL_INPUT}
    mount: /inputs/benchmark
    read_only: true
    sha256: null

submission:
  required_artifacts:
    - run_manifest
    - final_checkpoint
    - metrics

verifier:
  id: open3dbench-global-ppa-v1
  separate_environment: true

objective:
  kind: user_defined_ppa
  evaluator_profile: null
  primary_metric: user_defined
  direction: minimize
  reference_input: null
  parameters: {}

seed_policy:
  io_placement: 1
  partition: 1001
  placement: 1000
  routing: -1

evaluation:
  unknown_change_policy: all
  default_policy: suffix
  stages:
    - id: 00_input
      directory: 00_input
      runner_name: input
      depends_on: []
      implementation_paths: []
    - id: 10_floorplan
      directory: 10_floorplan
      runner_name: floorplan
      depends_on: [00_input]
      implementation_paths:
        - open3dbench/backend/io_place.py
        - open3dbench/backend/preplan.py
    - id: 15_timing_extract
      directory: 15_timing_extract
      runner_name: timing_extract
      depends_on: [10_floorplan]
      implementation_paths:
        - Place-3D/thirdparty/partition/extract_tp_gnn_timing_openroad.py
        - Place-3D/config/partition/**
    - id: 20_partition
      directory: 20_partition
      runner_name: partition
      depends_on: [15_timing_extract]
      implementation_paths:
        - Place-3D/src/partition/**
        - Place-3D/config/partition/**
    - id: 30_placement
      directory: 30_placement
      runner_name: placement
      depends_on: [20_partition]
      implementation_paths:
        - Place-3D/src/placement/**
        - Place-3D/config/placement/**
        - Place-3D/thirdparty/DREAMPlace/dreamplace/**
        - open3dbench/backend/die_init.py
    - id: 40_pdn
      directory: 40_pdn
      runner_name: pdn
      depends_on: [30_placement]
      implementation_paths:
        - open3dbench/backend/pdn.py
        - open3dbench/backend/pg_connect.py
    - id: 50_hbt
      directory: 50_hbt
      runner_name: hbt
      depends_on: [40_pdn]
      implementation_paths:
        - Place-3D/src/hbt/**
        - open3dbench/backend/hbt_grid.py
        - open3dbench/backend/hbt_materialize.py
        - open3dbench/backend/passive_hbt.py
    - id: 60_opt
      directory: 60_opt
      runner_name: opt
      depends_on: [50_hbt]
      implementation_paths:
        - open3dbench/backend/opt_handoff.py
        - open3dbench/backend/three_d_opt.py
    - id: 70_cts
      directory: 70_cts
      runner_name: cts
      depends_on: [60_opt]
      implementation_paths:
        - open3dbench/backend/clock_crossing.py
        - open3dbench/backend/three_d_cts.py
        - OpenROAD-3D/flow/scripts_3D/**cts**
    - id: 75_global_route
      directory: 75_global_route
      runner_name: global_routing
      depends_on: [70_cts]
      implementation_paths:
        - open3dbench/backend/three_d_route.py
        - OpenROAD-3D/flow/script_routing/**
        - OpenROAD-3D/openroad/src/grt/**
    - id: 80_route
      directory: 80_route
      runner_name: detailed_routing
      depends_on: [75_global_route]
      implementation_paths:
        - open3dbench/backend/three_d_route.py
        - OpenROAD-3D/flow/script_routing/**
        - OpenROAD-3D/openroad/src/drt/**
    - id: 90_report
      directory: 90_report
      runner_name: report
      depends_on: [80_route]
      implementation_paths: []
    - id: 95_thermal
      directory: 95_thermal
      runner_name: thermal
      depends_on: [90_report]
      implementation_paths: []

budget:
  global_rounds: 12
  concurrent_trials: 4
  expensive_evaluations: 12
