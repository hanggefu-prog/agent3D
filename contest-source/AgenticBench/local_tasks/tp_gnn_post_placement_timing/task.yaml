schema_version: 1
id: tp_gnn_post_placement_timing
title: TP-GNN loss evolution with global 2-way decoding and post-placement STA
description: Evolve the timing-context-v2 loss; score setup WNS and TNS after placement and HBT, without timing optimization.
kind: tp_gnn_post_placement_timing
base_config: reference_config.yaml
initial_candidate: initial_candidate
prompt: prompt.md
program:
  mode: task_adapter
  template: initial_program.py
  adapter: program_adapter.py
  entrypoint: compute_tp_gnn_loss
prompt_context:
  priority_parameters:
    - positive_scores
    - negative_scores
    - embeddings
    - positive_sources
    - positive_targets
    - negative_sources
    - negative_targets
    - epoch
    - max_epochs
    - graph_scores
    - graph_sources
    - graph_targets
    - graph_net_ids
    - graph_weights
    - net_weights
    - node_features
    - node_areas
  feedback_recent: 3
  feedback_top: 3
  max_feedback_chars: 24000
  max_source_chars: 36000
  source_ranges:
    - {path: Place-3D/src/partition/lol/methods/tp_gnn.py, start_line: 875, end_line: 1280}
execution:
  from: partition
  to: hbt
  upstream_stages: [input, floorplan]
  frozen_inputs:
    - name: tp_gnn_timing
      source: baseline_run
      path: 20_partition/timing_input
      inject_as: partition.timing_input
      required_files:
        - timing_features.csv
        - timing_net_weights.csv
        - timing_manifest.json
        - openroad_full_partition_last.connections.tsv
      json_checks:
        - path: timing_manifest.json
          equals:
            timing_status: full_coverage_partition_last
            timing_weight_mode: paper_delay_slack_hyperedge_v1
candidate_policy:
  allowed_config_paths:
    - partition.algorithm
  allowed_source_paths:
    - Place-3D/src/partition/lol/methods/tp_gnn.py
  max_changed_files: 1
  max_added_lines: 360
  max_deleted_lines: 12
  files: []
  value_constraints:
    - {path: /config_overrides/partition/algorithm, type: string, enum: [tp-gnn-flat]}
