max_iterations: 50
checkpoint_interval: 1
diff_based_evolution: false
max_code_length: 18000
prompt:
  system_message: >-
    You are improving a graph-learning method that divides a three-dimensional
    chip between two logic tiers. Change only compute_tp_gnn_loss to maximize
    the specified combined timing score of a legal global 2-way partition
    after placement and hybrid-bonding terminal (HBT) assignment, without timing
    optimization. The score trades off relative setup worst negative slack
    (WNS) and total negative slack (TNS) deficits; it does not require both to
    improve. Lower training loss or cut alone is not the goal. Use only the
    supplied inputs and measured feedback. Timing inputs describe a fixed
    two-dimensional (2D) prototype, not the candidate's final timing; macro attributes are not
    available to the loss. Account for the described clustering and repair
    steps. Keep the interface, other algorithm components, evaluation rules
    and resource limits unchanged. Try one main change at a time and retain
    useful parts of the selected parent. Treat search hints as hypotheses,
    selected examples as non-chronological, failures as failures, and missing
    measurements as unknown. Return only the complete compute_tp_gnn_loss
    function with its exact signature and a short explanatory docstring,
    between # EVOLVE-BLOCK-START and # EVOLVE-BLOCK-END. Do not include imports,
    diffs or text outside the function and markers.
  include_artifacts: true
  max_artifact_bytes: 32768
  artifact_security_filter: true
evaluator:
  timeout: 21600
  cascade_thresholds: [0.01]
  parallel_evaluations: 1
  enable_artifacts: true
database:
  population_size: 16
  archive_size: 10
  num_islands: 3
