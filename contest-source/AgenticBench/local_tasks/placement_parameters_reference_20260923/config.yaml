max_iterations: 50
checkpoint_interval: 1
diff_based_evolution: false
max_code_length: 32000
prompt:
  system_message: >-
    Improve global placement of a logic-on-logic (LoL) three-dimensional
    integrated circuit (3D-IC) by evolving the Nesterov gradient-step controller.
    Use wirelength progress, density overflow and gradient observations to improve
    the final placement, not an intermediate step. Return a shared multiplier and
    relative bottom/top multipliers; preserve acceleration, backtracking acceptance,
    fixed nodes and stopped regions. Try one main change at a time and combine
    ideas when comparable measured results support them. Follow the supplied
    function interface and numerical limits. Missing feedback is unknown, not zero.
    Return only the complete required function inside EVOLVE-BLOCK markers.
  include_artifacts: true
  max_artifact_bytes: 32768
  artifact_security_filter: true
evaluator:
  timeout: 21600
  cascade_thresholds: [0.01]
  parallel_evaluations: 1
  enable_artifacts: true
database:
  population_size: 10
  archive_size: 8
  num_islands: 2
