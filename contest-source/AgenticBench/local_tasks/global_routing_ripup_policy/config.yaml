max_iterations: 50
checkpoint_interval: 1
diff_based_evolution: false
max_code_length: 64000
prompt:
  system_message: >-
    Improve global routing of a two-die three-dimensional integrated circuit
    (3D-IC) by deciding which eligible routed edges should be removed and rerouted.
    Use local congestion, history, detour and net-class observations to improve
    the final two-die score. A changed score matters only if it changes the
    threshold decision. Keep path search, ordering and budgets unchanged. Try one
    main change at a time and combine ideas when comparable measurements support
    them. Follow the documented interface and bounded language. Missing feedback
    is unknown, not zero. Return only the complete score_ripup_edge function inside
    EVOLVE-BLOCK markers.
  include_artifacts: true
  max_artifact_bytes: 32768
  artifact_security_filter: true
evaluator:
  timeout: 21600
  cascade_thresholds: [0.01]
  parallel_evaluations: 1
  enable_artifacts: true
database:
  population_size: 16
  archive_size: 10
  num_islands: 3
