schema_version: 1
id: global_routing_iteration_controller_source
title: Die-aware FastRoute reroute-iteration controller evolution
description: Evolve a dynamic congestion-versus-wirelength controller from a frozen ariane133 CTS checkpoint.
kind: routing_iteration_controller_source
base_config: ../../local_bench/benchmark_inputs/ariane133_lol_ng45_tp_gnn_cts/config.yaml
benchmark_input: ariane133_lol_ng45_tp_gnn_cts
initial_candidate: initial_candidate
prompt: prompt.md
program:
  mode: task_adapter
  template: initial_program.py
  adapter: program_adapter.py
  entrypoint: control_reroute_iteration
prompt_context:
  priority_parameters:
    - die_overflow
    - max_overflow
    - congestion_trend
    - stagnation
    - wirelength_pressure
    - reroute_phase
    - die_id
    - hbt_pressure
    - ndr_pressure
    - critical_pressure
  feedback_recent: 3
  feedback_top: 3
  max_feedback_chars: 24000
  max_source_chars: 56000
  read_only_source_paths:
    - OpenROAD-3D/openroad/src/grt/src/fastroute/src/maze.cpp
    - OpenROAD-3D/openroad/src/grt/src/fastroute/src/RipUp.cpp
    - OpenROAD-3D/openroad/src/grt/src/fastroute/src/graph2d.cpp
  source_ranges:
    - {path: OpenROAD-3D/openroad/src/grt/src/fastroute/src/FastRoute.cpp, start_line: 1430, end_line: 1660}
    - {path: OpenROAD-3D/openroad/src/grt/src/fastroute/src/maze.cpp, start_line: 1000, end_line: 1340}
    - {path: OpenROAD-3D/openroad/src/grt/src/fastroute/src/RipUp.cpp, start_line: 160, end_line: 230}
execution:
  from: global_routing
  to: global_routing
  upstream_stages: [input, floorplan, partition, placement, pdn, hbt, opt, cts]
candidate_policy:
  allowed_config_paths: []
  allowed_source_paths:
    - OpenROAD-3D/openroad/src/grt/src/fastroute/src/FastRoute.cpp
    - open3dbench/backend/three_d_route.py
    - open3dbench/runner.py
  max_changed_files: 3
  max_added_lines: 1800
  max_deleted_lines: 24
  files: []
