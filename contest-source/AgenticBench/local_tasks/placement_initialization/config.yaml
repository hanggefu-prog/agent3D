max_iterations: 50
checkpoint_interval: 1
diff_based_evolution: false
max_code_length: 96000
prompt:
  system_message: >-
    Improve two-tier global placement by changing only initialize_position.
    The other placement component stays native. Use supplied geometry and
    optimization signals, preserve tier ownership and fixed-node masks, and
    optimize the stated final HPWL/overflow score. Keep all other settings
    unchanged. Try one main change at a time and use comparable evaluation
    feedback. Missing measurements are unknown, not zero. Return only the
    complete function inside EVOLVE-BLOCK markers.
  include_artifacts: true
  max_artifact_bytes: 32768
  artifact_security_filter: true
evaluator:
  timeout: 21600
  cascade_thresholds: [0.01]
  parallel_evaluations: 1
  enable_artifacts: true
database:
  population_size: 10
  archive_size: 8
  num_islands: 2
