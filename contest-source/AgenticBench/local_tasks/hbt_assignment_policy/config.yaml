max_iterations: 50
checkpoint_interval: 1
diff_based_evolution: false
max_code_length: 16000
prompt:
  system_message: >-
    Improve connections between two stacked logic tiers by evolving network
    priority and legal-site cost for hybrid bonding terminal (HBT) assignment.
    Use the supplied geometry and final evaluation feedback to improve
    joint setup timing after legal HBT placement. Keep the design, legal-site
    rules and timing analysis unchanged. Try one main idea at a time and judge
    it by comparable worst negative slack (WNS) and total negative slack (TNS)
    feedback, not by an intermediate cost alone. Missing measurements are
    unknown, not zero. Return only the complete net_priority(context) and
    site_cost(net_context, site_context) functions inside EVOLVE-BLOCK markers.
  include_artifacts: true
  max_artifact_bytes: 32768
  artifact_security_filter: true
evaluator:
  timeout: 21600
  parallel_evaluations: 1
  enable_artifacts: true
database:
  population_size: 10
  archive_size: 8
  num_islands: 2
