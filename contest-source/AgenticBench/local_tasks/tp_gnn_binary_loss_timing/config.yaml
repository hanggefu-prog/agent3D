max_iterations: 10
checkpoint_interval: 1
diff_based_evolution: false
max_code_length: 18000
prompt:
  system_message: >-
    Improve the loss of a graph neural network that predicts probabilities
    of assigning chip circuitry to two logic tiers. Change only
    compute_binary_partition_loss and preserve its exact interface. Optimize
    the specified combined setup worst negative slack (WNS) and total
    negative slack (TNS) score after legal partitioning, fixed placement and
    hybrid-bonding terminal (HBT) assignment and one fixed OPT pass.
    Cut, HPWL, probability confidence and training loss are diagnostics, not
    rewards. The model, full-graph training budget, optimizer, temperature,
    perturbation schedule, threshold and feasibility closure stay fixed.
    Use only the supplied probability, differentiable per-net cut, frozen
    net-weight, expected-cut, area and feature inputs;
    macro attributes, instance names and final timing are unavailable to the
    loss. Try one main change at a time and preserve useful parts of the
    selected parent. Missing measurements are unknown, not zero. Return only
    the complete compute_binary_partition_loss function with its exact
    signature and a short explanatory docstring between EVOLVE-BLOCK markers.
    Do not include imports, diffs, extra functions or text outside the markers.
    The native loss hook and trusted collector are connected. Candidate timing
    requires this task's fresh same-case reference from the exact initial
    program and fixed recipe. Missing qualification cannot be borrowed from
    another task. The search template does not authorize model calls itself.
  include_artifacts: true
  max_artifact_bytes: 32768
  artifact_security_filter: true
evaluator:
  timeout: 21600
  cascade_thresholds: [0.01]
  parallel_evaluations: 1
  enable_artifacts: true
database:
  population_size: 16
  archive_size: 10
  num_islands: 3
